<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近视防控文献库</title>
<style>
:root{color-scheme:light;--ink:#20333d;--muted:#61727c;--line:#dbe3e6;--accent:#216c70}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1200px;margin:auto;padding:28px 28px}h1{font-size:28px;letter-spacing:1px;margin:4px 0}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:260px 1fr;gap:26px;padding-top:24px}aside{align-self:start;background:white;border:1px solid var(--line);border-radius:12px;padding:20px}fieldset{border:0;padding:0;margin:0 0 22px}legend{font-weight:600;margin-bottom:9px}label.product{display:block;margin:9px 0;font-size:13px}input[type=checkbox]{accent-color:var(--accent);margin-right:7px}input[type=search],select{width:100%;font:inherit;padding:10px;background:white;border:1px solid #bdccd1;border-radius:7px;color:var(--ink)}select{margin:5px 0 14px}.tabs{display:flex;gap:7px;margin-top:20px}button{font:inherit;border:1px solid #cbd7db;border-radius:7px;padding:8px 20px;background:white;color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}button:hover{filter:brightness(.96)}:focus-visible{outline:3px solid #76b9bd;outline-offset:3px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:#e8eef0;border-radius:6px;padding:7px 12px;font-size:13px}.stat b{font-size:18px;margin-left:7px}.card{background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}summary{cursor:pointer;padding:20px;list-style:none}summary::-webkit-details-marker{display:none}.title{font-size:17px;font-weight:600;line-height:1.5;margin:9px 0}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#eef3f4;color:#4c626d;border-radius:4px;padding:2px 7px;font-size:11px}.tag.own{background:#e4f2ef;color:#25685b}.tag.competitor{background:#eceefa;color:#545b87}.tag.mixed{background:#f0eafa;color:#72548e}.preview{font-size:14px;margin-top:10px;color:#53656f}.expand{font-size:12px;color:var(--accent);margin-top:10px}.body{border-top:1px solid var(--line);padding:20px}.body h3{font-size:14px;margin:12px 0 5px}.abstract{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Georgia,serif;line-height:1.8}.links{display:flex;gap:18px;margin:16px 0}a{color:var(--accent)}.empty{padding:40px;background:white;border:1px dashed #bdccd1;text-align:center}.countline{font-size:13px;color:var(--muted);margin-bottom:14px}footer{padding-bottom:30px}#message{padding:20px} .hint{font-size:12px;color:var(--muted)}@media(max-width:760px){.wrap{padding:20px 16px}.layout{grid-template-columns:1fr;gap:16px}aside{padding:16px}#products{display:grid;grid-template-columns:1fr 1fr}fieldset{margin-bottom:12px}h1{font-size:24px}}
</style></head>
<body><header><div class="wrap"><div class="eyebrow">WENTAO · MEDICAL AFFAIRS · 文献工作台</div><h1>近视防控文献库</h1><p class="muted">自家产品与市面竞品的文献整理 · 基于现有摘要及元数据</p><nav class="tabs" aria-label="文献归属"><button data-side="own" aria-pressed="false">自家</button><button data-side="competitor" aria-pressed="false">竞品</button><button data-side="all" aria-pressed="true">全部</button></nav></div></header>
<div id="message" class="wrap" role="status">正在读取本地文献数据…</div>
<div id="app" class="wrap layout" hidden><aside><fieldset><legend>产品 / 光学设计</legend><div id="products"></div><div class="hint">多选为“任一匹配”；未选择时包含全部。</div></fieldset><label for="status">文献状态</label><select id="status"><option value="">全部状态</option></select><label for="year">发表年份</label><select id="year"><option value="">全部年份</option></select><label for="stype">研究类型</label><select id="stype"><option value="">全部研究类型</option></select><button id="reset">重置筛选</button><p class="hint">mixed 文献同时计入自家与竞品。产品命中表示文中涉及，不代表直接比较或疗效结论。</p></aside><main><label for="search" class="muted">检索文献</label><input id="search" type="search" placeholder="题名、作者、PMID、中文要点或摘要" autocomplete="off"><div class="stats" id="stats" aria-live="polite"></div><div class="countline" id="count"></div><div id="list"></div></main></div><footer class="wrap hint">数据来自已有文献记录；产品清单为可编辑草稿。自动标签及原始中文要点应结合原文复核。外部文献链接需要联网。</footer>
<script>
(function(){
'use strict';
var data, side='all', selected=new Set(), labels={own:'自家',competitor:'竞品',mixed:'自家 + 竞品',other:'其他 / 未归类'};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function str(v){return Array.isArray(v)?v.join('；'):String(v||'')}
function tag(t,c){return '<span class="tag '+(c||'')+'">'+esc(t)+'</span>'}
function safeLink(url,label){try{var u=new URL(url);if(u.protocol==='https:'||u.protocol==='http:')return '<a target="_blank" rel="noopener noreferrer" href="'+esc(u.href)+'">'+label+' ↗</a>'}catch(e){}return ''}
function render(){
var q=$('search').value.trim().toLowerCase();
var records=data.records.filter(function(r){return (side==='all'||r.side===side||r.side==='mixed')&&(!selected.size||r.productIds.some(function(id){return selected.has(id)}))&&['status','year','stype'].every(function(k){return !$(k).value||str(r[k])===$(k).value})&&(!q||r._search.indexOf(q)!==-1)});
var own=records.filter(function(r){return r.side==='own'||r.side==='mixed'}).length, comp=records.filter(function(r){return r.side==='competitor'||r.side==='mixed'}).length;
$('stats').innerHTML='<span class="stat">当前条数 <b>'+records.length+'</b></span><span class="stat">涉及自家 <b>'+own+'</b></span><span class="stat">涉及竞品 <b>'+comp+'</b></span>';
$('count').textContent='共 '+data.records.length+' 条 · 当前按年份由新到旧排列 · 自家 / 竞品统计包含交集';
$('list').innerHTML=records.length?records.map(function(r){
var products=r.productIds.map(function(id){return data.products.find(function(p){return p.id===id})}).filter(Boolean);
var evidence=r.productMatches.map(function(m){var p=data.products.find(function(p){return p.id===m.productId});return (p?p.name:m.productId)+'：'+(m.method==='excel'?'用户总表分表':m.method==='design'?'设计标签':'文本关键词')+' ['+m.terms.join(' / ')+']'}).join('；');
return '<details class="card"><summary><div class="tags">'+tag(r.side in labels?labels[r.side]:r.side,r.side)+tag(r.status)+tag(r.year)+tag(r.stype)+'</div><div class="title">'+esc(r.title||'题名缺失')+'</div><div class="muted">'+esc(str(r.authors))+' · '+esc(r.journal)+' · PMID '+esc(r.pmid||'未提供')+'</div><div class="tags" style="margin-top:10px">'+products.map(function(p){return tag(p.name)}).join('')+'</div><div class="preview">'+esc(r.zh||r.zhAbs||'暂无中文要点')+'</div><div class="expand">展开 / 收起 · 中文要点与英文摘要</div></summary><div class="body"><h3>中文要点（原记录）</h3><p>'+esc(r.zh||'暂无中文要点')+'</p>'+(r.zhAbs?'<h3>中文摘要（原记录）</h3><p>'+esc(r.zhAbs)+'</p>':'')+'<h3>英文摘要</h3><div class="abstract">'+esc(r.abstract||'原始记录未提供摘要。')+'</div>'+(r.pending?'<h3>待确认事项</h3><p>'+esc(r.pending)+'</p>':'')+'<div class="links">'+(r.pmid?safeLink('https://pubmed.ncbi.nlm.nih.gov/'+encodeURIComponent(r.pmid)+'/', 'PubMed'):safeLink(r.url,'原始链接'))+(r.doi?safeLink('https://doi.org/'+r.doi,'DOI'):'')+'</div><p class="hint">自动归类依据：'+esc(evidence||'未命中产品清单；归为其他。')+'</p><p class="hint">原始设计：'+esc(str(r.designs))+' · 核验层级：'+esc(r.vlevel||'未注明')+'</p></div></details>'}).join(''):'<div class="empty">没有符合条件的文献。请调整搜索词或重置筛选。</div>';
}
fetch('./data.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
data=d;data.records.forEach(function(r){r._search=['title','authors','pmid','zh','zhAbs','abstract','keywords'].map(function(k){return str(r[k])}).join('\n').toLowerCase()});data.records.sort(function(a,b){return Number(b.year||0)-Number(a.year||0)});
$('products').innerHTML=data.products.map(function(p){return '<label class="product"><input type="checkbox" value="'+esc(p.id)+'">'+esc(p.name)+'</label>'}).join('');
['status','year','stype'].forEach(function(k){var values=Array.from(new Set(data.records.map(function(r){return str(r[k])}).filter(Boolean))).sort();if(k==='year')values.reverse();values.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;$(k).appendChild(o)});$(k).addEventListener('change',render)});
$('products').addEventListener('change',function(e){if(e.target.checked)selected.add(e.target.value);else selected.delete(e.target.value);render()});$('search').addEventListener('input',render);
document.querySelectorAll('[data-side]').forEach(function(b){b.addEventListener('click',function(){side=b.dataset.side;document.querySelectorAll('[data-side]').forEach(function(t){t.setAttribute('aria-pressed',String(t===b))});render()})});
$('reset').addEventListener('click',function(){selected.clear();side='all';$('search').value='';['status','year','stype'].forEach(function(k){$(k).value=''});document.querySelectorAll('#products input').forEach(function(c){c.checked=false});document.querySelectorAll('[data-side]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.side==='all'))});render()});
$('message').hidden=true;$('app').hidden=false;render();
}).catch(function(e){$('message').textContent='无法读取数据。请在本目录运行 python3 -m http.server 8765 --bind 127.0.0.1，再访问 http://127.0.0.1:8765/ 。错误：'+e.message});
})();
</script></body></html>
